
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karpenter-load-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karpenter-load-test
  template:
    metadata:
      labels:
        app: karpenter-load-test
    spec:
      containers:
        - name: pause
          image: public.ecr.aws/eks-distro/kubernetes/pause:3.7
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"


